name: Android checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/worker.test.mjs
      - name: Native contracts
        run: |
          cmake -S native -B native-out -DCMAKE_BUILD_TYPE=Release
          cmake --build native-out --parallel 2
          ctest --test-dir native-out --output-on-failure
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dark-code-scene-preview
          path: app/build/outputs/apk/debug/app-debug.apk
