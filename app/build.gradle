plugins { id 'com.android.application' }
def authUrl = providers.gradleProperty('authBaseUrl').getOrElse('')
if (authUrl && !(authUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::443)?/)) {
    throw new GradleException('authBaseUrl debe ser un origen HTTPS sin ruta ni credenciales.')
}
android {
    namespace 'com.darkcode.login'
    compileSdk 35
    defaultConfig {
        applicationId 'com.darkcode.login'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-preview'
        buildConfigField 'String', 'AUTH_BASE_URL', '"' + authUrl + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
