plugins { id 'com.android.application' }
def authUrl = providers.gradleProperty('authBaseUrl').getOrElse('')
def panelOnly = providers.gradleProperty('panelOnly').getOrElse('false').toBoolean()
if (authUrl && !(authUrl ==~ /https:\/\/[A-Za-z0-9.-]+(?::443)?/)) {
    throw new GradleException('authBaseUrl debe ser un origen HTTPS sin ruta ni credenciales.')
}
android {
    namespace 'com.darkcode.login'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.darkcode.login'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake {
            cppFlags '-std=c++17'
            arguments '-DDARKCODE_PANEL_ONLY=' + (panelOnly ? 'ON' : 'OFF')
        } }
        testInstrumentationRunner providers.gradleProperty('testRunner').getOrElse('com.darkcode.login.PreviewRunner')
        buildConfigField 'String', 'AUTH_BASE_URL', '"' + authUrl + '"'
        buildConfigField 'boolean', 'PANEL_ONLY', panelOnly.toString()
        manifestPlaceholders = [espEnabled: (!panelOnly).toString()]
    }
    buildFeatures { buildConfig true }
    if (panelOnly) { sourceSets.main.assets.setSrcDirs(['src/panelOnly/assets']) }
    externalNativeBuild { cmake { path file('../native/CMakeLists.txt'); version '3.22.1' } }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
